syntax = "proto3";

package SFG.Own2dEngine.NetworkMessages;

message MsgContent {
  string username = 1;
  string msg_text = 2;
}

message SendMessageRequest {
  MsgContent msg = 1;
}

message SendMessageResponse {
  bool success = 1;
  string error_msg = 2;
}

message GetAllMessagesRequest {
  // string dont_care = 1;
}

message AllMessages {
  repeated MsgContent msg_list = 1;
}

message ReqRepErrorMessage {
  // string dont_care = 1;
}
