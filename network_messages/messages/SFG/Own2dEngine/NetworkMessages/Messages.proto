syntax = "proto3";

package SFG.Own2dEngine.NetworkMessages;

message MsgContent {
  string username = 1;
  string msgText = 2;
}

message SendMessageRequest {
  MsgContent msg = 1;
}

message SendMessageResponse {
  bool success = 1;
  string errorMsg = 2;
}

message GetAllMessagesRequest {}

message AllMessages {
  repeated MsgContent msgList = 1;
}

message ReqRepErrorMessage {}
